---
# CI on git.cmdln.it, where the project is developed. GitHub is a push mirror of
# it and runs .github/workflows/lint.yml instead: Gitea ignores
# .github/workflows when this directory exists. Keep the two in step.
name: Lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_CORE_VERSION: "2.20.4"
  ANSIBLE_LINT_VERSION: "26.4.0"

jobs:
  ansible-lint:
    name: ansible-lint
    # The shared Debian 13 CI runner of git.cmdln.it. The job runs inside its
    # container (host mode), so the home directory persists between runs and
    # nothing is installed there.
    runs-on: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ansible-core and ansible-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "ansible-core==$ANSIBLE_CORE_VERSION" \
            "ansible-lint==$ANSIBLE_LINT_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # ansible.cfg looks for the collections in the checkout (collections_path = .)
      # and for a vault password file: no vault is tracked, any content will do.
      # One install per requirements file: with two -r only the last one counts.
      - name: Install the collections of the project and of its tests
        run: |
          echo ci > .ansible-vault-pass.txt
          ansible-galaxy collection install -p . -r requirements.yaml
          ansible-galaxy collection install -p . -r tests/requirements.yaml

      - name: Show versions
        run: |
          python3 --version
          ansible --version
          ansible-lint --version

      # Playbooks, tests and inventory; it runs the syntax check of every playbook
      - name: Run ansible-lint
        run: ansible-lint
