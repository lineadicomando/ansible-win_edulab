---
# Example inventory, and home of the test VMs. Copy it to start a new one.
#
# Every host is declared once, with its address, under the group that says what it
# is: servers, teachers or students. The other groups only name hosts or groups
# that already exist, so adding a PC means one entry here plus one in its lab.
all:
  children:
    servers:
      hosts:
        dc01:
          ansible_host: 192.168.122.2
          ansible_mac: 52:54:00:38:64:a0
    # Role groups: the teacher PC runs the Veyon Master, the students are its agents
    # (group_vars/teachers, group_vars/students). ansible_mac is needed by wol and veyon.
    teachers:
      hosts:
        teacher:
          ansible_host: 192.168.122.10
          ansible_mac: 52:54:00:1c:82:8e
    students:
      hosts:
        student01:
          ansible_host: 192.168.122.11
          ansible_mac: 52:54:00:a6:db:78
        student02:
          ansible_host: 192.168.122.12
          ansible_mac: 52:54:00:bf:d8:d6
    # Vertical groups: one per lab, listing its PCs directly. They are the default
    # targets of playbooks/lab_cad.yaml and playbooks/lab_coding.yaml. Real labs rarely
    # share machines; the three test VMs here belong to both.
    lab_cad:
      hosts:
        teacher:
        student01:
        student02:
    lab_coding:
      hosts:
        teacher:
        student01:
        student02:
    # Transversal group: every Windows PC, whatever lab it sits in, built from the
    # labs. It carries the connection settings (group_vars/lab_win) and is the default
    # target of the lab-wide playbooks: wol, shutdown, veyon, maintenance.
    # An inventory holding a single lab can build it from the role groups instead:
    #   lab_win:
    #     children:
    #       teachers:
    #       students:
    lab_win:
      children:
        lab_cad:
        lab_coding:
    # samba_dc is a convention required by the lineadicomando.samba_dc collection.
    # The samba.yaml and samba_dc_backup.yaml playbooks default to this group so that
    # AD management commands are never accidentally broadcast to non-DC hosts.
    samba_dc:
      hosts:
        dc01:
