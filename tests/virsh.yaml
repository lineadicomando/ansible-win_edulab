---
- name: Manage VM via virsh
  hosts: localhost
  connection: local
  gather_facts: false
  # The user running the playbook needs access to the system instance (the libvirt
  # group on Fedora and Debian), not root: no become.
  environment:
    LIBVIRT_DEFAULT_URI: "{{ test_vm_libvirt_uri | default('qemu:///system') }}"
  vars:
    snapshot: ~
    cmd: ~
    vm: []
    allowed_cmd:
      - snapshot-revert
      - start
      - shutdown
      - reboot
      - reset
  tasks:
    - name: Validate cmd input
      ansible.builtin.assert:
        that:
          - cmd is string
          - cmd | trim | length > 0
          - cmd in allowed_cmd
        fail_msg: "La variabile `cmd` deve essere valorizzata (es. start)."

    - name: Snapshot Revert
      ansible.builtin.assert:
        that:
          - snapshot is string
          - snapshot | trim | length > 0
        fail_msg: "La variabile `snapshot` deve essere valorizzata (es. baseline)."
      when:
        - cmd == 'snapshot-revert'
    - name: Normalize vm when passed as string
      ansible.builtin.set_fact:
        vm: ["{{ vm }}"]
      when: vm is string

    - name: Validate vm input
      ansible.builtin.assert:
        that:
          - vm is sequence
          - vm | length > 0
        fail_msg: "Passa `vm` come lista non vuota di host/gruppi di inventario."

    - name: Expand vm entities to inventory hosts
      ansible.builtin.set_fact:
        vm_hosts: >-
          {{
            vm_hosts | default([]) +
            query('inventory_hostnames', item)
          }}
      loop: "{{ vm }}"

    - name: Deduplicate expanded hosts
      ansible.builtin.set_fact:
        vm_hosts: "{{ vm_hosts | unique }}"

    - name: Map inventory hosts to virtual machine names
      ansible.builtin.set_fact:
        vm_names: >-
          {%- set names = [] -%}
          {%- for h in vm_hosts -%}
          {%- set _ = names.append(hostvars[h]['libvirt_domain'] | default(none)) -%}
          {%- endfor -%}
          {{ names }}

    - name: Validate that every resolved host names its VM
      ansible.builtin.assert:
        that:
          - (vm_names | reject('none') | list | length) == (vm_hosts | length)
        fail_msg: >-
          Every host needs libvirt_domain in the inventory.
          Hosts: {{ vm_hosts }}
          VM names: {{ vm_names }}

    # A libvirt network that is not active has no bridge on the host: the VM
    # cannot start, and the magic packet of the wake step that follows is sent
    # to a broadcast address the host no longer owns, so it never reaches the
    # Wake-on-LAN listener. This is the state of a freshly booted host where
    # the libvirt network daemon is socket-activated.
    - name: List the active libvirt networks
      ansible.builtin.command:
        cmd: virsh net-list --name
      register: vm_net_active
      changed_when: false

    - name: List the network interfaces of the selected VMs
      ansible.builtin.command:
        cmd: "virsh domiflist {{ item }}"
      loop: "{{ vm_names }}"
      register: vm_iflist
      changed_when: false

    - name: Start the libvirt networks of the selected VMs that are not active
      ansible.builtin.command:
        cmd: "virsh net-start {{ item }}"
      loop: >-
        {{
          vm_iflist.results | map(attribute='stdout_lines') | flatten
          | map('split') | selectattr('1', 'defined') | selectattr('1', 'eq', 'network')
          | map(attribute='2') | unique
          | difference(vm_net_active.stdout_lines)
        }}
      changed_when: true

    - name: Revert selected snapshot for selected VMs
      ansible.builtin.command:
        cmd: "virsh {{ params }}"
      vars:
        params: >-
          {{
            cmd +
            " " +
            item +
            ( "" if cmd != 'snapshot-revert' else " " + snapshot )
          }}
      loop_control:
        label: "virsh {{ params }}"
      loop: "{{ vm_names }}"
      changed_when: true
