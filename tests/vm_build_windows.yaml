---
# Build Windows 11 test VMs from scratch, with no manual step: Windows Setup driven by
# an answer file, the account and password of the inventory, OpenSSH Server with
# PowerShell as its shell, the static address of the inventory, then a shut-off
# `baseline` snapshot. VM name, address and MAC come from hosts.yaml.
#
#   ansible-playbook tests/vm_build_windows.yaml -e vm=teacher
#   ansible-playbook tests/vm_build_windows.yaml -e vm=win_managed
#   ansible-playbook tests/vm_build_windows.yaml -e vm=teacher -e rebuild=true
#
# rebuild=true first destroys the existing VM with its disk, TPM, NVRAM and snapshots.
# Without it the playbook stops if the VM already exists.
#
# test_vm_win11_iso is the path of the Windows 11 Enterprise Evaluation ISO
# (docs/test-vms.md): pass it with -e, or set it in local/test_vms.yaml, which this
# playbook loads when present. An installation takes 20-40 minutes: run it in the
# background with its output in logs/.
#
# What fails where: Setup and OOBE show on the VM screen (virt-viewer, or the
# tools/vm scripts); the first-logon script logs to C:\Windows\Temp\edulab-setup.log.

- name: Check the request
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the VMs to build
      ansible.builtin.assert:
        that:
          - vm is defined
          - vm | length > 0
        fail_msg: "Pass the hosts or groups to build: -e vm=teacher"

- name: Build Windows test VMs
  hosts: "{{ vm | default([]) }}"
  gather_facts: false
  vars:
    rebuild: false
    # NetBIOS name: at most 15 characters, no underscore.
    test_vm_computer_name: "{{ (inventory_hostname | upper | regex_replace('[^A-Z0-9-]', '-'))[:15] }}"
    test_vm_unattend_volume: "{{ libvirt_domain }}-unattend.iso"
    test_vm_win_install_timeout: 5400
    test_vm_local_vars: "{{ playbook_dir }}/../local/test_vms.yaml"
  tasks:
    - name: Prepare and start the installation
      delegate_to: localhost
      environment:
        LIBVIRT_DEFAULT_URI: "{{ test_vm_libvirt_uri }}"
        LC_ALL: C
      block:
        - name: Load the workstation settings
          ansible.builtin.include_vars:
            file: "{{ test_vm_local_vars }}"
          when: test_vm_local_vars is file

        - name: Check that the host is a Windows test VM and the ISO is there
          ansible.builtin.assert:
            that:
              - libvirt_domain is defined
              - inventory_hostname in groups['win_managed']
              - test_vm_win11_iso is defined
              - test_vm_win11_iso is file
            fail_msg: >-
              {{ inventory_hostname }} needs libvirt_domain in hosts.yaml and must be in
              win_managed; test_vm_win11_iso must point to the ISO
              ({{ test_vm_win11_iso | default('not set') }}).

        - name: Look for an existing VM
          ansible.builtin.command:
            cmd: "virsh dominfo {{ libvirt_domain }}"
          register: test_vm_existing
          changed_when: false
          check_mode: false
          failed_when: false

        - name: Stop if the VM exists and rebuild was not asked for
          ansible.builtin.fail:
            msg: >-
              {{ libvirt_domain }} already exists. Pass -e rebuild=true to destroy it,
              its disk and its snapshots, and build it again.
          when:
            - test_vm_existing.rc == 0
            - not (rebuild | bool)

        - name: Read the memory available on the host  # noqa: run-once[task]
          ansible.builtin.shell:
            cmd: awk '/^MemAvailable/ {print int($2 / 1024)}' /proc/meminfo
          register: test_vm_mem_available
          changed_when: false
          check_mode: false
          run_once: true

        - name: Check that the VMs fit in the available memory  # noqa: run-once[task]
          ansible.builtin.assert:
            that:
              - test_vm_mem_required | int <= test_vm_mem_available.stdout | int
            fail_msg: >-
              The VMs need {{ test_vm_mem_required }} MiB, the host has
              {{ test_vm_mem_available.stdout }} MiB available. Build fewer at once,
              or shut down other VMs.
          vars:
            test_vm_mem_required: >-
              {{ ansible_play_hosts | map('extract', hostvars, 'test_vm_win_memory_mib') | map('int') | sum }}
          run_once: true

        - name: Remove the existing VM
          when: test_vm_existing.rc == 0
          block:
            - name: Power off the existing VM
              ansible.builtin.shell:
                cmd: >-
                  [ "$(virsh domstate {{ libvirt_domain }})" = "shut off" ]
                  || virsh destroy {{ libvirt_domain }}
              changed_when: true

            # --storage names the disks only: --remove-all-storage would also delete
            # an installation ISO that sits in a libvirt pool.
            - name: Undefine the existing VM with its disks, NVRAM, TPM and snapshots
              ansible.builtin.shell:
                executable: /bin/bash
                cmd: >-
                  set -o pipefail;
                  disks=$(virsh domblklist {{ libvirt_domain }} --details
                  | awk '$2 == "disk" {print $3}' | paste -sd, -) &&
                  virsh undefine {{ libvirt_domain }} --nvram --tpm --snapshots-metadata
                  ${disks:+--storage "$disks"}
              changed_when: true

        - name: Delete a leftover answer volume
          ansible.builtin.command:
            cmd: "virsh vol-delete --pool {{ test_vm_pool }} {{ test_vm_unattend_volume }}"
          register: test_vm_vol_leftover
          changed_when: test_vm_vol_leftover.rc == 0
          failed_when: false

        # The answer file carries the password in clear: it is built in a private
        # directory under /tmp and goes straight into the libvirt pool, never into the
        # work tree (which may be synced elsewhere).
        - name: Build the answer ISO and upload it to the pool
          block:
            - name: Create a private build directory
              ansible.builtin.tempfile:
                state: directory
                suffix: -edulab
              register: test_vm_tmp

            - name: Create the ISO layout
              ansible.builtin.file:
                path: "{{ test_vm_tmp.path }}/iso/edulab"
                state: directory
                mode: "0700"

            - name: Write the answer file
              ansible.builtin.template:
                src: "{{ playbook_dir }}/vm_build/autounattend.xml.j2"
                dest: "{{ test_vm_tmp.path }}/iso/autounattend.xml"
                mode: "0600"
              no_log: true

            - name: Write the first-logon script
              ansible.builtin.template:
                src: "{{ playbook_dir }}/vm_build/setup.ps1.j2"
                dest: "{{ test_vm_tmp.path }}/iso/edulab/setup.ps1"
                mode: "0600"

            - name: Pack the ISO
              ansible.builtin.command:
                argv: [xorriso, -as, mkisofs, -quiet, -J, -r, -V, EDULAB,
                       -o, "{{ test_vm_tmp.path }}/unattend.iso", "{{ test_vm_tmp.path }}/iso"]
              changed_when: true

            - name: Read the ISO size
              ansible.builtin.stat:
                path: "{{ test_vm_tmp.path }}/unattend.iso"
              register: test_vm_unattend_iso

            - name: Create the answer volume
              ansible.builtin.command:
                cmd: >-
                  virsh vol-create-as {{ test_vm_pool }} {{ test_vm_unattend_volume }}
                  {{ test_vm_unattend_iso.stat.size }}b --format raw
              changed_when: true

            - name: Upload the ISO into the volume
              ansible.builtin.command:
                cmd: >-
                  virsh vol-upload --pool {{ test_vm_pool }} {{ test_vm_unattend_volume }}
                  {{ test_vm_tmp.path }}/unattend.iso
              changed_when: true
          always:
            - name: Remove the build directory
              ansible.builtin.file:
                path: "{{ test_vm_tmp.path }}"
                state: absent
              when: test_vm_tmp.path is defined

        # Secure Boot with Microsoft keys enrolled, TPM 2.0 and SMM: the requirements of
        # Windows 11 Setup. SATA disk and e1000e NIC: in-box drivers, no virtio ISO.
        # While installing, virt-install runs the VM with on_reboot=destroy and starts it
        # again with the final configuration (boot from disk) at the first reboot of
        # Setup; it does that only while it is still running, hence --wait and async.
        - name: Create the VM and start Windows Setup
          ansible.builtin.command:
            argv:
              - virt-install
              - --name={{ libvirt_domain }}
              - --osinfo=win11
              - --memory={{ test_vm_win_memory_mib }}
              - --vcpus={{ test_vm_win_vcpus }}
              - --cpu=host-passthrough
              - --machine=q35
              - --boot=uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes,firmware.feature1.name=enrolled-keys,firmware.feature1.enabled=yes
              - --features=smm.state=on
              - --tpm=backend.type=emulator,backend.version=2.0,model=tpm-crb
              - --disk=pool={{ test_vm_pool }},size={{ test_vm_win_disk_gib }},format=qcow2,bus=sata
              - --cdrom={{ test_vm_win11_iso }}
              - --disk=vol={{ test_vm_pool }}/{{ test_vm_unattend_volume }},device=cdrom,bus=sata
              - --network=network={{ test_vm_network }},mac={{ ansible_mac }},model=e1000e
              - --graphics=spice
              - --video=qxl
              - --input=tablet,bus=usb
              - --noautoconsole
              - --wait=-1
          async: "{{ test_vm_win_install_timeout }}"
          poll: 0
          register: test_vm_virt_install
          changed_when: true

        # The firmware boots the ISO only if a key is pressed within a few seconds; the
        # prompt shows 3-5 s after start. Stop soon: once Setup copies files its Cancel
        # button has the focus, and a late Enter would abort the installation.
        - name: Press a key at the "boot from CD or DVD" prompt
          ansible.builtin.shell:
            cmd: >-
              sleep 2; for i in $(seq 1 15); do
              virsh send-key {{ libvirt_domain }} KEY_ENTER >/dev/null 2>&1; sleep 1;
              done
          changed_when: false

        - name: Wait for the first phase of Setup (copy of the image, then reboot)
          ansible.builtin.async_status:
            jid: "{{ test_vm_virt_install.ansible_job_id }}"
          register: test_vm_virt_install_job
          until: test_vm_virt_install_job.finished
          changed_when: false
          retries: "{{ (test_vm_win_install_timeout | int / 30) | int }}"
          delay: 30

    - name: Wait for SSH at the static address of the inventory
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 300
        timeout: "{{ test_vm_win_install_timeout }}"
      delegate_to: localhost

    - name: Wait for an Ansible connection
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Read the outcome of the first-logon script
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $log = 'C:\Windows\Temp\edulab-setup'
          [pscustomobject]@{
              done = Test-Path "$log.done"
              log = if (Test-Path "$log.log") { Get-Content "$log.log" -Raw } else { '' }
          }
      register: test_vm_setup

    - name: Stop if the first-logon script failed
      ansible.builtin.fail:
        msg: "{{ test_vm_setup.output[0].log }}"
      when: not test_vm_setup.output[0].done

    - name: Read the evaluation period left
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $p = Get-CimInstance SoftwareLicensingProduct -Filter 'PartialProductKey IS NOT NULL' |
              Where-Object Name -like 'Windows*' | Select-Object -First 1
          [pscustomobject]@{
              name = $p.Name
              expires = (Get-Date).AddMinutes($p.GracePeriodRemaining).ToString('yyyy-MM-dd')
          }
      register: test_vm_eval

    - name: Report the evaluation expiry
      ansible.builtin.debug:
        msg: >-
          {{ libvirt_domain }}: {{ test_vm_eval.output[0].name }},
          evaluation ends on {{ test_vm_eval.output[0].expires }}.

    - name: Shut Windows down
      ansible.windows.win_command:
        cmd: shutdown.exe /s /t 5 /f
      changed_when: true

    - name: Take the baseline snapshot
      delegate_to: localhost
      environment:
        LIBVIRT_DEFAULT_URI: "{{ test_vm_libvirt_uri }}"
        LC_ALL: C
      block:
        # An ACPI shutdown is often ignored the first time: ask again every minute.
        - name: Wait for the VM to be shut off
          ansible.builtin.shell:
            cmd: >-
              for i in $(seq 1 60); do
              [ "$(virsh domstate {{ libvirt_domain }})" = "shut off" ] && exit 0;
              [ $((i % 6)) -eq 0 ] && virsh shutdown {{ libvirt_domain }} >/dev/null 2>&1;
              sleep 10;
              done; exit 1
          changed_when: false

        # The snapshot keeps the domain XML: with the media still attached, a revert
        # would point at an answer volume that no longer exists.
        - name: Eject the installation media
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              set -o pipefail;
              for t in $(virsh domblklist {{ libvirt_domain }} --details
              | awk '$2 == "cdrom" && $4 != "-" {print $3}'); do
              virsh change-media {{ libvirt_domain }} "$t" --eject --config || exit 1;
              done
          changed_when: true

        - name: Delete the answer volume
          ansible.builtin.command:
            cmd: "virsh vol-delete --pool {{ test_vm_pool }} {{ test_vm_unattend_volume }}"
          changed_when: true

        - name: Create the baseline snapshot
          ansible.builtin.command:
            argv:
              - virsh
              - snapshot-create-as
              - "{{ libvirt_domain }}"
              - baseline
              - --description
              - >-
                {{ test_vm_eval.output[0].name }}, account {{ ansible_user }}, OpenSSH Server,
                {{ ansible_host }}; built by tests/vm_build_windows.yaml, evaluation
                ends {{ test_vm_eval.output[0].expires }}
          changed_when: true
