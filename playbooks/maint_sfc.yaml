---
# System File Checker (sfc /scannow): scans and repairs the protected system
# files. Restarts first a host with a reboot pending (win_workman_restart).
#
# Survey: win_workman_restart (bool, true)
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: System file check
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Check the system files
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: sfc
        wf_step_tasks:
          - sfc
