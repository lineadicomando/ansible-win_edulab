---
# Example of a lab software set: the packages of a CAD lab. For a set kept in
# the inventory instead, see software.yaml.
#
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: CAD lab packages
  hosts: "{{ wf_hosts | default(target_hosts | default('lab_cad')) }}"
  gather_facts: false
  tasks:
    - name: Install the packages
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: lab_cad
        wf_step_tasks:
          - "libreoffice"
          - "chrome"
          - "sketchup2026"
          - "autocadlt2026"
          - "tinycad"
