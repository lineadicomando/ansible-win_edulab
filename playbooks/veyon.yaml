---
# Veyon: installs it and configures it, the teachers as masters and the
# students as agents (win_workman_veyon_master in group_vars/teachers and
# group_vars/students), with the keypair and the lab network objects.
#
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Veyon
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Install and configure Veyon
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: veyon
        wf_step_tasks:
          - veyon
          - veyon-config
