---
# Pauses Windows Update, so that hosts do not update on their own between two
# runs of wu_run.yaml (which takes win_workman_wu_unpause to resume them first).
# Beyond 35 days, set wu_max_pause_days too: the pause is otherwise shortened
# to the cap.
#
# Workflow: the step after wu_run.yaml.
# Survey: wu_pause_for (text; default 1-m) a duration in days, weeks or calendar
#           months: 10, 10-d, 2-w, 1-m; the end date is computed on the host
#         wu_max_pause_days (text; default empty, cap unchanged) a duration in
#           the same form: raise the cap first, e.g. 2-m with wu_pause_for 2-m
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Windows Update pause
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  vars:
    wu_pause_for: 1-m
    wu_max_pause_days: ""
  tasks:
    - name: Check wu_pause_for
      ansible.builtin.assert:
        that: wu_pause_for | string is match('^[0-9]+(-[dwm])?$')
        fail_msg: "wu_pause_for must be a duration such as 10, 2-w or 1-m, not '{{ wu_pause_for }}'"
        quiet: true
      run_once: true

    - name: Check wu_max_pause_days
      ansible.builtin.assert:
        that: wu_max_pause_days | string is match('^([0-9]+(-[dwm])?)?$')
        fail_msg: "wu_max_pause_days must be empty or a duration such as 35 or 2-m, not '{{ wu_max_pause_days }}'"
        quiet: true
      run_once: true

    - name: Pause Windows Update
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: wu-pause
        wf_step_tasks: >-
          {{ (['wu-max_pause_days-' ~ wu_max_pause_days] if wu_max_pause_days | string | length > 0 else [])
             + ['wu-pause-' ~ wu_pause_for] }}
