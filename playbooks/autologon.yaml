---
# Windows autologon, with the account given by win_workman_autologon_* in the
# inventory, then a restart so that it takes effect.
#
# Survey: win_workman_autologon_restart (bool, true)
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Autologon
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  vars:
    win_workman_autologon_restart: true
  tasks:
    - name: Configure autologon
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: autologon
        wf_step_tasks:
          - autologon
