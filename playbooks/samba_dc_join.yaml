---
# Joins the managed Windows PCs to the Samba AD domain through the domain role
# of lineadicomando.win_workman, which first points their DNS at the DC (the
# domain SRV records are only served there). Variables: win_workman_domain_*
# in group_vars/all.
- name: Join Windows hosts to the Samba AD domain
  hosts: "{{ target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win') }}"  # override: -e target_hosts=<group>
  gather_facts: false
  roles:
    - role: lineadicomando.win_workman.dispatcher
      vars:
        win_workman_tasks:
          - "domain-join"
