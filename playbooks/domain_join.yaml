---
# Joins the managed Windows PCs to the Active Directory domain through the domain
# role of lineadicomando.win_workman, which first points their DNS at the domain
# controllers (the domain SRV records are only served there). Any AD DC will do.
# Variables: win_workman_domain_* in group_vars/all.
#
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Join Windows hosts to the AD domain
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Join the domain
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: domain-join
        wf_step_tasks:
          - domain-join
