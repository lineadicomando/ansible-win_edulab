---
# Brings the Windows Update page of Settings in line with what is installed, in
# the session of the logged-on user: fixes updates already installed that
# Settings still offers or shows as failed. Skips hosts with nobody logged on.
# wu_run.yaml does it on its own after installing (win_workman_wu_sync_ui).
#
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Windows Update, Settings page
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Refresh the Settings page
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: wu-sync_ui
        wf_step_tasks:
          - wu-sync_ui
