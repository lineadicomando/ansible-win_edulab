---
# Example of a lab software set: the packages of a coding lab. For a set kept
# in the inventory instead, see software.yaml.
#
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Coding lab packages
  hosts: "{{ wf_hosts | default(target_hosts | default('lab_coding')) }}"
  gather_facts: false
  tasks:
    - name: Install the packages
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: lab_coding
        wf_step_tasks:
          - "libreoffice"
          - "chrome"
          - "edge"
          - "firefox"
          - "brave"
          - "gimp"
          - "inkscape"
          - "ntop"
          - "p7zip"
          - "puredata"
          - "postman"
          - "vscode"
          - "python314"
          - "embarcadero_devcpp"
