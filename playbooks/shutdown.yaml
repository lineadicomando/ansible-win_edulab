---
# Shuts the hosts down and waits until each one goes offline: a host whose
# shutdown is cancelled (shutdown /a) or stuck fails the step, so wf_hosts lists
# only the hosts that went down. -e win_workman_shutdown_wait=false returns as
# soon as the command is sent; win_workman_shutdown_wait_timeout (900) is the
# margin after the delay, for hosts installing updates at shutdown.
#
# Workflow: the last step, after the unlock (maint_unlock.yaml).
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Shutdown
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Shut the hosts down
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: shutdown
        wf_step_tasks:
          - shutdown
