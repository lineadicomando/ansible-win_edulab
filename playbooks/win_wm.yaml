---
# Runs any win_workman task strings, given in t as a comma-separated list or a
# list: t=chrome,vscode, t=wu-run,restart, t=firefox-off. The full catalogue is
# the roles/ directory of the collection, or get_role_info of the MCP server.
#
#   ansible-playbook playbooks/win_wm.yaml -l teacher -e t=chrome
#
# It runs on win_managed (or target_hosts), so it no longer reaches the domain
# controller or other hosts outside it. A survey on t gives an operator every
# action of the collection: keep such a template for administrators, and give
# operators the playbooks of one step (software.yaml, wu_run.yaml, ...).
# The run_tasks tool of the MCP server calls the collection's playbook itself.
# A wol in t (t=wol,chrome) wakes the hosts before the other tasks, whatever its
# place in the list: a host has to be awake for the dispatcher to reach it.
#
# Survey: t (text) task strings joined by commas
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Windows workstations manager
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  vars:
    t: ""
    _t_list: "{{ t.split(',') | map('trim') | select | list if t is string else t }}"
  tasks:
    - name: Run the tasks
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: win_wm
        wf_wake: "{{ _t_list | select('in', ['wol', 'wol-on']) | list | length > 0 }}"
        wf_step_tasks: "{{ _t_list | reject('in', ['wol', 'wol-on']) | list }}"
