---
# Online disk check (chkdsk /scan): no restart, nothing scheduled for the next
# boot. A volume with errors fails the host, and still needs an offline repair.
#
# Variables: win_workman_chkdsk_volumes (list, [C]), a list: set it in the
#            inventory or in the template's variables, not in a survey
# Passes on: wf_hosts, wf_unreachable, wf_failed (see tasks/wf_step.yaml)
- name: Disk check
  hosts: "{{ wf_hosts | default(target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win')) }}"
  gather_facts: false
  tasks:
    - name: Check the disks
      ansible.builtin.import_tasks: tasks/wf_step.yaml
      vars:
        wf_step: chkdsk
        wf_step_tasks:
          - chkdsk
