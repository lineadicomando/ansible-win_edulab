---
# The checks run in a block and the unlock in its always section: a workstation
# that fails one of them still ends up failed in the recap, but is not left
# with logon restricted to administrators. wol stays outside the block, so a
# host that never woke up is not chased for an unlock it does not need. A host
# with no ansible_mac in the inventory skips it: a lab of laptops on Wi-Fi
# cannot be woken, and is maintained as it is found, already switched on.
#
# For the command line and MCP. A cockpit-fleet workflow chains the same work
# as separate steps instead (wol, maint_lock, maint_restart, maint_chkdsk,
# maint_wim_scan, maint_sfc, maint_optimize, maint_unlock, wf_report): see
# docs/playbooks.md.
- name: Routine maintenance — disk, component store and system file checks
  hosts: "{{ target_hosts | default('win_managed' if 'win_managed' in groups else 'lab_win') }}"
  gather_facts: false
  tasks:
    # The wol role itself, not the dispatcher: before any task the dispatcher
    # sets the ACL of the remote temporary directories, which needs the host awake.
    - name: Wake the workstations
      ansible.builtin.include_role:
        name: lineadicomando.win_workman.wol
      vars:
        win_workman_action: "on"
      when: ansible_mac is defined

    - name: Maintenance with the workstation locked
      block:
        - name: Lock and check
          ansible.builtin.include_role:
            name: lineadicomando.win_workman.dispatcher
          vars:
            win_workman_tasks:
              - "lock"
              - "restart-if-pending"
              - "chkdsk"
              - "wim-scan"
              - "sfc"
              - "optimize"
      always:
        - name: Unlock and restart
          ansible.builtin.include_role:
            name: lineadicomando.win_workman.dispatcher
          vars:
            win_workman_tasks:
              - "lock-off"
              - "restart"
